# ============================================================
#  ILUMINACION RGB
# ============================================================

CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Los LEDs se encienden solos al conectar el USB y, al desconectarlo, se apagan
# Y ADEMAS se corta la energia externa, asi que dejan de consumir del todo.
# Con bateria nunca gastan; con cable siempre alumbran.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y

# No arrancar siempre con los LEDs encendidos: decide el USB.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# NOTA: no hace falta declarar CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER.
# Viene activada de fabrica (app/Kconfig.defaults), y es la que hace que la
# tecla RGB_TOG, ademas de apagar los LEDs, corte la energia externa.

# ============================================================
#  PANTALLA OLED
# ============================================================

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y

# ============================================================
#  AHORRO DE ENERGIA
# ============================================================

# A los 15 minutos sin usar el teclado: apaga LEDs y pantalla, desconecta el
# Bluetooth y corta la energia externa. Despertar tarda unos segundos porque
# el teclado tiene que reconectarse.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
